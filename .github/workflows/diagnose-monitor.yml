name: Radar TI - diagnostico offline do runner

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: 'SHA completo do commit revisado na main; executa somente testes offline'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: radar-ti-offline-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'ramondrte/vagas-ti-monitor' &&
      github.ref == 'refs/heads/main' &&
      inputs.reviewed_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Testes offline sem Secrets e sem estado persistente
        run: python -B diagnose_monitor.py
